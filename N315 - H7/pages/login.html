<section class="login-page" aria-label="Login and sign up">
  <div class="login-container">
    <form class="login-form" action="#" method="post">
      <h1>Login Here!</h1>
      <label class="visually-hidden" for="login-email">Email Address</label>
      <input id="login-email" name="email" type="email" placeholder="Email Address" autocomplete="email" required>
      <label class="visually-hidden" for="login-password">Password</label>
      <input id="login-password" name="password" type="password" placeholder="Password" autocomplete="current-password" required>
      <button type="submit">Login</button>
    </form>

    <form class="signup-form" action="#" method="post">
      <small>don't have an account?</small>
      <h1>Sign Up!</h1>
      <label class="visually-hidden" for="signup-first-name">First Name</label>
      <input id="signup-first-name" name="firstName" type="text" placeholder="First Name" autocomplete="given-name" required>
      <label class="visually-hidden" for="signup-last-name">Last Name</label>
      <input id="signup-last-name" name="lastName" type="text" placeholder="Last Name" autocomplete="family-name" required>
      <label class="visually-hidden" for="signup-email">Email Address</label>
      <input id="signup-email" name="email" type="email" placeholder="Email Address" autocomplete="email" required>
      <label class="visually-hidden" for="signup-password">Password</label>
      <input id="signup-password" name="password" type="password" placeholder="Password" autocomplete="new-password" minlength="6" required>
      <button type="submit">Sign Up</button>
    </form>
  </div>
</section>
